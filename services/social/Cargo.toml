[package]
name = "social"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Social: rooms, direct messages, presence and profiles per QOR ID (ADR-091)"
repository = "https://github.com/QOR-MATRIX/demiurge-chain"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.43", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The same database stack as QOR ID. Every statement is a literal with bound parameters (src/sql_hygiene.rs).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# QOR ID's introspection endpoint (ADR-091 decision 2), over rustls as QOR ID itself calls out.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Message bodies are sealed at rest (ADR-091 decision 4).
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# A real WebSocket client for the tests, against the service on a loopback port.
tokio-tungstenite = "0.26"
