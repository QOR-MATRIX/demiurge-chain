[package]
name         = "qor-launcher"
version      = "0.1.17"
description  = "QOR Launcher — the sovereign gateway to the Demiurge ecosystem"
authors      = ["Laustrup Group"]
edition      = "2021"
rust-version = "1.91"
license      = "Apache-2.0"

[lib]
name       = "qor_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener       = "2"
tauri-plugin-dialog       = "2"
tauri-plugin-notification = "2"
tauri-plugin-os           = "2"
tauri-plugin-process      = "2"
tauri-plugin-shell        = "2"
# qor://pay links from websites (ADR-076): the scheme, and one running launcher that receives a link clicked while it
# runs instead of a second copy starting.
tauri-plugin-deep-link    = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
# What holds the keys and talks to the chain, shared with the Android launcher and QOR OS (ADR-104, ADR-120): the
# wallet, QOR ID's and Social's clients, the chain client, the Library's index, the Mesh and Qontrol (DIRECTION L13.2).
# Their dependencies, and the audit notes on them, are the core's Cargo.toml's.
qor-launcher-core = { path = "../core", features = ["net", "desktop"] }
toml       = "0.9"

tokio   = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Cryptography ────────────────────────────────────────────────────────────
# sp-core carries the ecosystem's Sr25519 keys, its derivation and SS58
# (ADR-023, ADR-024). Pinned to the version in `polkadot-stable2606-1`, the
# release the chain is built against (ADR-022), so the launcher and the chain
# derive and verify identically — ADR-033 rule 1 names exactly this case.
# `full_crypto` is what makes `Pair::sign` available; `serde` is what makes
# SS58 encoding and decoding available. Its secp256k1 stack (k256, ecdsa,
# elliptic-curve, crypto-bigint 0.5) is always built, and RUSTSEC-2026-0387 in
# crypto-bigint 0.5 is ignored only because no code here uses ECDSA or
# secp256k1 (ADR-115): using `sp_core::ecdsa`, or any of those crates, fails CI
# until ADR-115 is revisited.
sp-core          = { version = "=43.0.0", features = ["full_crypto", "serde"] }
sha2             = "0.10"
zeroize          = { version = "1", features = ["derive"] }
rand             = "0.8"
subtle           = "2"

hex        = "0.4"
# The account's own avatar, kept on this machine for offline, handed to the webview as a data URL (ADR-079).
base64     = "0.22"
chrono     = { version = "0.4", features = ["serde"] }
uuid       = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
# The product host's operating-system checks (ADR-046, ADR-088): its own crate, because they are FFI and this one
# forbids unsafe code.
qor-host-proof = { path = "../host-proof" }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = { version = "0.14.3", default-features = false }
whatlang = "0.18.0"
sys-locale = "0.3.2"
# The update channel (L6.2, ADR-111): Tauri's updater, at the release that fits this Tauri (2.14 needs a newer one), and
# minisign's verifier, with which the host checks each download a second time, against the signed file's name. Without
# the updater's `zip` feature: a Windows update is the signed installer itself, never an archive, and zip 4, which that
# feature brings, has three open advisories (RUSTSEC-2026-0367 to 0369) on extracting archives.
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
minisign-verify      = "0.2"

[features]
default = []
# Test-only. Qontrol's tests that commit need the qontrol-git helper, and one
# needs git itself; without them they skip, and a skipped test reports ok. This
# feature makes them fail instead, for any run that is meant to be evidence: CI,
# and the Qontrol gate's suite in docs/GATES.toml. It changes nothing in the
# application. Qontrol's tests are the core's since DIRECTION L13.2, so this turns
# on the core's feature of the same name, and holds the one test that stays here.
qontrol-no-skips = ["qor-launcher-core/qontrol-no-skips"]

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true

[dev-dependencies]
# The core's test stand-ins (an in-memory keychain, a scripted confirmation, the test process's logger), for tests only
# (ADR-104).
qor-launcher-core = { path = "../core", features = ["net", "desktop", "testing"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
