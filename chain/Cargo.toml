# The Demiurge chain: a purpose-built Substrate L1 on the Polkadot SDK (ADR-013).
#
# Its own workspace. It was created separate from `framework/`, the custom Rust
# devnet it replaces; that directory was deleted at M3.5 and nothing here ever
# depended on it.
#
# Location and crate names: ADR-032. Pinned release: ADR-022. Dependency policy:
# ADR-033 — the pinned SDK governs every version it dictates, and is not chased.

[workspace]
resolver = "2"
members = ["node", "pallets/arq-wallet", "pallets/drc369", "pallets/drc369-royalties", "pallets/validator-set", "runtime"]

[workspace.package]
authors = ["Demiurge"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/QOR-MATRIX/demiurge-chain"
version = "0.1.0"

[workspace.dependencies]
# The umbrella crate for `polkadot-stable2606-1` (ADR-022). Pinned exactly: the
# release governs, and a later patch release is a deliberate, tested move under
# ADR-033 rule 3, never an incidental upgrade.
polkadot-sdk = { version = "=2606.1.0", default-features = false }

codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

demiurge-runtime = { path = "runtime", default-features = false }
pallet-arq-wallet = { path = "pallets/arq-wallet", default-features = false }
pallet-drc369 = { path = "pallets/drc369", default-features = false }
pallet-drc369-royalties = { path = "pallets/drc369-royalties", default-features = false }
pallet-validator-set = { path = "pallets/validator-set", default-features = false }

[profile.release]
panic = "unwind"
opt-level = 3

# A runtime's wasm must be deterministic and small; the SDK's own profile settings.
[profile.production]
inherits = "release"
lto = true
codegen-units = 1
