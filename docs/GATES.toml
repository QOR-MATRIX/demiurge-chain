# ===========================================================================
# THE PRODUCT GATES: one per product (DIRECTION.md, the product tracks)
# ===========================================================================
#
# Added 2026-09-21 at the owner's instruction, in the form ADR-050 (Proposed)
# describes. They come after Public Release on purpose: a product gate may count
# chain items, and a chain gate never counts a product item or names a product
# gate. NOTHING BELOW CHANGES ALPHA, BETA OR PUBLIC RELEASE, and a slipping
# product cannot make the chain look further from mainnet.
#
# Every criterion reads the tree -- ADR statuses, roadmap checkboxes, open
# questions and test suites -- and none is a check a person asserts. Each gate
# counts, by number, the chain, launcher and product items its own track says it
# depends on, rather than naming a whole chain gate, so a product is not held by
# a criterion it does not need, such as a name clearance or a published genesis.
#
# The decisions criteria list the Proposed substrate records each product builds
# on. No record defines any of the six products yet; when one is written it joins
# its product's list. `adrs = []` is never written.

[[gates]]
id = "qontrol"
name = "Qontrol"
means = """
Version control for creative work: git-compatible on disk, gitoxide for every \
read and libgit2 for staging in a process of its own, a published version \
minted as a DRC-369 asset, and a remote over the Mesh."""

  [[gates.criteria]]
  id = "qontrol.decisions"
  kind = "adr"
  adrs = ["ADR-046", "ADR-048", "ADR-050"]

  [[gates.criteria]]
  id = "qontrol.roadmap"
  kind = "roadmap"
  items = ["P1.1", "P1.2", "P1.3", "P1.4", "P1.5", "P1.6", "P1.7"]

  [[gates.criteria]]
  id = "qontrol.depends"
  kind = "roadmap"
  # P1.6 needs the wire format, DRC-369 with remix royalties, and the host
  # dialog for its signature; P1.7 needs the Mesh and entitlements.
  items = ["L1.4", "M2.3", "M4.1", "M4.2", "M8.1", "M8.2"]

  # The split path, pinned. Each was proven to fail first (5a44207), and the
  # suite runs under qontrol-no-skips, so a missing helper or git fails the run
  # rather than reading as a pass.
  [[gates.criteria]]
  id = "qontrol.tests"
  kind = "tests"
  suite = "qontrol"
  # The last three are the diff's reason for existing: line endings and
  # .gitattributes read as git reads them, or a Windows creator sees every line
  # of a file changed when one word was (2026-09-23, proven to fail first).
  require = ["after_a_commit_the_working_tree_is_clean",
             "git_itself_agrees_the_tree_is_clean",
             "the_two_ignore_implementations_agree",
             "core_autocrlf_is_honoured_as_git_honours_it",
             "a_gitattributes_text_rule_is_honoured",
             "a_gitattributes_no_diff_rule_makes_a_file_binary",
             # P1.2 (2026-09-26): the two acts that lose work if they are got
             # wrong, and the guard that keeps a secret out of history. The
             # first two were proven to fail first.
             "a_switch_that_would_overwrite_an_edit_is_refused_and_touches_nothing",
             "a_credential_file_stops_a_commit_until_it_is_accepted",
             "discarding_a_new_file_is_refused_and_it_survives"]

[[gates]]
id = "qfx"
name = "QFX"
means = """
The launcher's living visual layer in three layers -- backdrop, responsive \
interface, personal space -- authored by creators and paid for when used, \
under contrast and frame-time contracts the chrome owns and no theme can \
weaken."""

  [[gates.criteria]]
  id = "qfx.decisions"
  kind = "adr"
  adrs = ["ADR-048", "ADR-050", "ADR-051"]

  [[gates.criteria]]
  id = "qfx.roadmap"
  kind = "roadmap"
  # P2.8 was appended to the track on 2026-09-22 and counted by nobody until
  # 2026-09-23, which is the same omission as L4.6 in beta.launcher.
  items = ["P2.1", "P2.2", "P2.3", "P2.4", "P2.5", "P2.6", "P2.7", "P2.8"]

  [[gates.criteria]]
  id = "qfx.depends"
  kind = "roadmap"
  # P2.3's macOS system sound needs a signing identity; P2.6 needs QOR Engine's
  # editor, and by the owner's decision of 2026-09-22 no scene becomes a theme
  # until CI runs (L1.7) and the signing dialogs are verified by a person (L1.4);
  # P2.7 needs DRC-369, the Mesh and Market's purchase path.
  items = ["L1.4", "L1.7", "L6.1", "M4.1", "M4.2", "M8.1", "M8.2", "P3.2", "P5.5"]

  # Text stays readable over any colour the canvas could paint: the worst case
  # under the chrome's scrim, solved rather than sampled.
  [[gates.criteria]]
  id = "qfx.contrast"
  kind = "tests"
  suite = "qfx_contrast"
  require = []

  # The backdrop does what the Ambience setting says: live draws, still and
  # reduced motion schedule no frame, Off hides it. Driven through the app.
  [[gates.criteria]]
  id = "qfx.ambience"
  kind = "tests"
  suite = "qfx_ambience"
  require = []

