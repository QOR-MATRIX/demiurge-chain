# ---------------------------------------------------------------------------
# Kinds of signal. Each criterion has exactly one kind.
# ---------------------------------------------------------------------------

[kinds.check]
reads = "this file: `done` and `evidence` (a commit hash, a URL, or a dated owner confirmation recorded in HANDOFF.md)"
met = "done = true and evidence is not empty"

[kinds.roadmap]
reads = "docs/DIRECTION.md: the checkbox of each item in `items`"
met = "the checkbox is [x]"
unmeasurable = "the item has no checkbox"

[kinds.adr]
reads = "docs/decisions/README.md: the Status column of each ADR in `adrs`"
met = "the status begins with \"Accepted\""

[kinds.inventory]
reads = "docs/architecture/MIGRATION_INVENTORY.md section 8, \"Resolution status\" table: the Status of each question in `questions`"
met = "the status reads \"Resolved by ADR-nnn\" and that ADR is Accepted"

[kinds.open_question]
reads = "docs/economics/OPEN_QUESTIONS.md: which item headings are present"
met = "the item's heading is absent; that file removes an item once it is decided"

[kinds.tests]
reads = "the most recent run of `suite`: its exit status and the test names it reports"
met = "the run exited 0, reported no failures, and every name in `require` passed"
unmeasurable = "the suite has no directory, or has never been run"

[kinds.ci]
reads = "GitHub Actions on QOR-MATRIX/demiurge-chain (ADR-063, ADR-064): the latest run of `workflow` on `branch`, .github/workflows/ci.yml"
met = "that run concluded success and ran on the branch head"

# What "Pleroma CI" runs. A "ci" unit is met only when the whole run passed.
# Removing or relaxing anything listed here is loosening (see the rule above).
[ci]
workflow = "Pleroma CI"
repository = "QOR-MATRIX/demiurge-chain"
file = ".github/workflows/ci.yml"
quality_gates = [
  "chain/: cargo fmt --all --check; cargo clippy --workspace --all-targets -D warnings; cargo test --workspace --locked, WITHOUT SKIP_WASM_BUILD, which cannot build a chain specification and is never evidence",
  "chain/: two validators agree, finalise and catch up. A job of its own, because it needs a release build with the sudo feature: cargo build -p demiurge-node --release --features sudo --locked, then node scripts/check-two-validators.mjs. It fails the run; criterion alpha.multi-validator reads it. Since 2026-09-21 it runs NIGHTLY (03:00 UTC) and on workflow_dispatch, not on every push",
  "services/qor-auth: cargo fmt --check; cargo clippy --all-targets -D warnings; cargo test -- --include-ignored, against a migrated Postgres 16 and a Redis 7.4",
  "tools/qor-launcher: npm ci, frontend build and npm run check (design, accessibility, gates view, Projects view, QFX contrast); the qontrol-git helper's cargo fmt --check, clippy -D warnings, tests and build; then cargo fmt --check, cargo clippy --all-targets -D warnings and cargo test --features qontrol-no-skips in src-tauri, so a Qontrol test whose helper or git is missing fails rather than skips",
  "cargo audit of services/qor-auth, ignoring only RUSTSEC-2023-0071 while CI confirms rsa is outside the compiled graph (services/qor-auth/.cargo/audit.toml)",
  "cargo audit of tools/qor-launcher/src-tauri",
  "cargo audit of tools/qor-launcher/qontrol-git, the libgit2 helper",
  "framework/ stays retired: the security job fails if the directory returns, and with it the six advisories its audit.toml exempted until M3.5",
  "no private key material tracked in git",
  "no credentials committed in configuration files",
  "no log call in services/qor-auth/src interpolates a token, key, secret, password, link or address, and no request span records the URI",
  "no [patch] section in any tracked manifest, and no reference to a personal Substrate fork anywhere tracked, excluding only ci.yml itself and HANDOFF.md",
]
not_in_ci_yet = [
  "tools/qor-launcher chain::live: it needs a running development node. Worth adding once the chain job's build time in CI is known.",
]
reports = [
  "coverage: cargo-llvm-cov line coverage for the pallets listed in beta.value-pallet-coverage, uploaded as the \"coverage\" artifact. It does not fail the run; the coverage kind compares it with the threshold.",
  "cargo audit of chain/: runs and does not fail the run, so a new advisory is visible without an exemption file hiding the known ones. NO criterion reads it, and it is not a quality gate. Its 10 vulnerabilities were measured one by one on 2026-09-20: four are compiled, six are not, and every one of the four is held by a version the pinned SDK dictates, which ADR-033 rule 1 does not override. Each is named with what blocks it and what would close it in SECURITY.md, \"Dependency advisories in chain/\". Making it a gate is a decision for when those four can close.",
]

[kinds.http]
reads = "an HTTP GET to `url`"
met = "the response status equals `expect_status`"
unmeasurable = "url is empty. A URL is written here only once the service it names has actually been deployed under ADR-015."

[kinds.pallet]
reads = "the Polkadot SDK chain workspace (suite \"chain\"): each pallet in `pallets` is a member crate, and its tests named in `require` pass"
met = "every listed pallet exists and its required tests pass"
unmeasurable = "`pallets` is empty or the chain suite has no directory; both wait on inventory Q-8 and Q-15"

[kinds.coverage]
# Coverage is required only on the pallets that move CGT or own DRC-369
# semantics, never as a global threshold. The tool is cargo-llvm-cov (approved
# 2026-09-14). CI produces the report (DIRECTION.md, L1.7), so the signal is
# computed, not asserted.
reads = "the line-coverage report cargo-llvm-cov writes in CI, for each pallet in `pallets`"
met = "every listed pallet's line coverage is at least `threshold` percent"
unmeasurable = "`pallets` is empty, or CI has not produced a report for the branch head"

[kinds.gate]
reads = "the state of the gate named in `gate`"
met = "that gate is passed"

# ---------------------------------------------------------------------------
# Test suites a criterion can name.
# ---------------------------------------------------------------------------

[suites.chain]
dir = "chain"  # The Polkadot SDK chain (ADR-032). Exists since 2026-09-17.
command = "cargo test --workspace"

[suites.qor_auth]
dir = "services/qor-auth"
command = "cargo test -- --include-ignored"
needs = "DATABASE_URL pointing at a migrated Postgres whose user can create databases (sqlx checks queries at compile time, and #[sqlx::test] creates a database per test); QOR_AUTH_TEST_REDIS_URL pointing at a Redis, for the tests that need one"

[suites.launcher]
dir = "tools/qor-launcher/src-tauri"
command = "cargo test"

# The product suites (see THE PRODUCT GATES at the end). Qontrol's code and
# QFX's are launcher code today, so their suites run in tools/qor-launcher. QOR
# Engine and GNOSIS have no directory yet (ADR-050, Proposed), so their suites
# have none either and stay unmeasurable until products/<name> exists.

[suites.qontrol]
dir = "tools/qor-launcher/src-tauri"
command = "cargo test --features qontrol-no-skips qontrol::"
needs = "the qontrol-git helper built (cargo build --manifest-path tools/qor-launcher/qontrol-git/Cargo.toml) and git installed. Under qontrol-no-skips a test missing either fails rather than skips, because a skipped test reports ok"

[suites.qfx_contrast]
dir = "tools/qor-launcher"
command = "node scripts/check-contrast.mjs"
needs = "npm run build first, and a Chromium-family browser (set BROWSER_PATH for one not in the usual places)"

[suites.qfx_ambience]
dir = "tools/qor-launcher"
command = "node scripts/check-accessibility.mjs"
needs = "npm run build first, and a Chromium-family browser (set BROWSER_PATH for one not in the usual places)"

[suites.qor_engine]
dir = ""  # products/qor-engine does not exist
command = "cargo test --workspace"

[suites.gnosis]
dir = ""  # products/gnosis does not exist
command = "cargo test --workspace"

# ===========================================================================
# ALPHA: the team devnet
# ===========================================================================

[[gates]]
id = "alpha"
name = "Alpha"
means = """
The base chain runs on the Polkadot SDK as a multi-validator devnet. DRC-369 \
assets can be minted on it, and QOR ID and the launcher use it. Team use only; \
nothing holds value."""

  [[gates.criteria]]
  id = "alpha.base-decisions"
  kind = "inventory"
  questions = ["Q-1", "Q-2", "Q-3", "Q-4", "Q-5", "Q-6", "Q-7", "Q-8",
               "Q-9", "Q-10", "Q-11", "Q-12", "Q-13", "Q-14", "Q-15", "Q-16"]

  [[gates.criteria]]
  id = "alpha.decisions"
  kind = "adr"
  adrs = ["ADR-013", "ADR-014", "ADR-015"]

  # 7.1.4 needs the owner's eye, and is deliberately left counted for now.
  # It reads "Authorise DRC-369 mint, and require owning the parent to nest",
  # and it is ticked -- but the code it was ticked against was the custom
  # chain's DRC-369 module, deleted with framework/ at M3.5. No DRC-369 code
  # exists in active scope, so the tick cannot be substantiated in the tree,
  # and the work returns as M4.1, M4.2 and M4.5.
  #
  # It stays counted because REMOVING a unit from a gate is loosening, and
  # loosening is the owner's separate decision under the rule at the top of
  # this file. Leaving it with this note is the documentation fix; taking it
  # out is the decision. Recorded so it is not mistaken for an oversight.
  [[gates.criteria]]
  id = "alpha.security-track"
  kind = "roadmap"
  items = ["7.1.1", "7.1.2", "7.1.3", "7.1.4", "7.1.5", "7.1.6", "7.1.7"]

  [[gates.criteria]]
  id = "alpha.credentials-rotated"
  kind = "check"
  says = "The Postgres credential and both JWT secrets removed from source on 2026-09-14 have been rotated."
  done = true
  evidence = "Owner confirmation, 2026-09-14, recorded in HANDOFF.md"

  [[gates.criteria]]
  id = "alpha.base-chain"
  kind = "roadmap"
  items = ["M2.1", "M2.2", "M2.3", "M3.1", "M3.2", "M3.3", "M3.4", "M3.5"]

  [[gates.criteria]]
  id = "alpha.pallets"
  kind = "pallet"
  # The ledger and the names are decided (ADR-025, ADR-032). Filled in with each
  # pallet and its required tests once those tests exist: a pallet listed with no
  # required tests would count as met on existence alone.
  pallets = ["pallet-drc369", "pallet-drc369-royalties"]
  require = [
    # M4.1, the first pallet (ADR-047, ADR-052). R-2 joins with nesting at M4.2.
    "an_unsigned_or_root_mint_is_refused",
    "a_mint_goes_to_the_signer_in_the_signers_own_collection",
    "the_content_reference_is_41_bytes",
    "a_malformed_reference_is_refused",
    "make_permanent_is_one_way_and_revise_is_refused_after",
    "a_revision_needs_the_owner_a_known_asset_and_a_change",
    "events_carry_the_content_reference",
    "the_singles_collection_is_created_exactly_once_per_creator",
    "a_mint_holds_its_deposits_from_the_minter",
    "a_mint_that_cannot_be_paid_for_moves_nothing",
    "owner_enumeration_follows_the_ledger",
    # M4.2's remix provenance (ADR-061); the depth bound shown to fail first.
    "a_remix_records_its_source_and_depth_and_anyone_may_declare_one",
    "a_remix_of_nothing_or_past_the_depth_bound_is_refused_at_mint",
    # M4.2's royalties and settled sale (ADR-061). Each money path was shown to
    # fail against a planted fault before it was trusted (HANDOFF.md).
    "a_split_always_sums_to_the_price",
    "the_remix_pool_is_divided_in_proportion_to_the_sources_shares",
    "rounding_goes_to_the_seller_and_never_above_a_share",
    "the_largest_intermediate_cannot_overflow",
    "terms_change_only_while_the_creator_holds_the_asset",
    "a_remixed_works_remix_share_can_fall_but_never_rise",
    "terms_must_be_well_formed",
    "a_sale_pays_the_royalties_then_the_seller_and_hands_the_asset_over",
    "a_remix_pays_its_source_first_then_its_own_recipients",
    "a_remix_pays_its_direct_source_only",
    "a_listing_is_void_once_its_seller_no_longer_holds_the_asset",
    "a_sale_the_buyer_cannot_pay_for_moves_nothing",
    "a_part_that_cannot_be_received_refuses_the_whole_sale",
    # Nesting and R-2 (ADR-065); each shown to fail against a planted fault first.
    "an_owner_nests_an_asset_and_takes_it_out_again",
    "only_the_owner_of_both_assets_may_nest_them",
    "an_asset_cannot_be_nested_in_itself",
    "a_two_asset_cycle_is_refused",
    "a_longer_cycle_is_refused",
    "nesting_deeper_than_the_bound_is_refused",
    "an_asset_holding_others_cannot_itself_be_nested",
    "a_parent_holds_no_more_than_the_bound",
    "a_nested_asset_and_the_asset_holding_it_cannot_be_transferred",
    "an_asset_is_in_one_place_at_a_time_and_only_assets_nest",
    # A purchase held to the work seen, and a preview that moves nothing
    # (spec_version 6); each shown to fail against a planted fault on 2026-10-03.
    "buy_exact_refuses_an_asset_revised_after_the_buyer_looked",
    "a_preview_names_the_parts_a_sale_then_pays",
    "a_preview_with_a_buyer_moves_nothing",
    "a_preview_says_why_a_sale_could_not_settle",
    "a_preview_knows_an_earlier_part_opens_the_account_a_later_one_reaches",
  ]

  [[gates.criteria]]
  id = "alpha.asset-core"
  kind = "roadmap"
  items = ["M4.1"]

  # M4.1's tests, read by name, so the tick above is never the only evidence.
  # The pallet's behaviour (the first five were each shown to fail against a
  # planted fault before they were trusted) and what only the runtime decides:
  # the call filter that makes pallet-drc369 the only way an asset is created,
  # the recorded bounds, the placeholder deposits and the runtime API.
  [[gates.criteria]]
  id = "alpha.asset-core-tests"
  kind = "tests"
  suite = "chain"
  require = [
    "an_unsigned_or_root_mint_is_refused",
    "a_malformed_reference_is_refused",
    "make_permanent_is_one_way_and_revise_is_refused_after",
    "events_carry_the_content_reference",
    "the_singles_collection_is_created_exactly_once_per_creator",
    "owner_enumeration_follows_the_ledger",
    "only_drc369_can_create_or_change_an_asset",
    "the_asset_bounds_are_the_ones_recorded_with_a_source",
    "the_placeholder_deposits_are_derived_from_the_existential_deposit",
    "the_largest_deposit_a_mint_holds_is_exact",
    "a_first_mint_holds_the_collection_and_later_mints_do_not",
    "the_runtime_api_lists_what_an_account_holds",
  ]

  [[gates.criteria]]
  id = "alpha.chain-tests"
  kind = "tests"
  suite = "chain"
  # The chain's acceptance tests (MIGRATION_INVENTORY section 9). Filled in on
  # 2026-09-18, as they were written, and extended the same day with block
  # import and replay refusal. R-2, refusing nesting cycles, joins this list with
  # pallet-drc369 at M4. Multi-validator agreement needs real nodes and is not
  # here yet; the parent-hash rule cannot be covered from inside the runtime at
  # all (see the note in block_import.rs).
  require = [
    # The defect that made the custom chain untrusted, by all three routes.
    "a_transfer_to_oneself_creates_no_cgt",
    "a_keep_alive_transfer_to_oneself_creates_no_cgt",
    "transferring_everything_to_oneself_creates_no_cgt",
    # Supply is conserved, and no path in the runtime creates CGT.
    "an_ordinary_transfer_moves_value_without_creating_any",
    "producing_blocks_creates_no_cgt",
    # The existential deposit, at the value ADR-036 decided.
    "the_runtime_uses_the_existential_deposit_that_was_decided",
    "an_account_left_below_the_existential_deposit_is_reaped_and_its_dust_is_lost",
    "an_account_cannot_be_created_below_the_existential_deposit",
    # Requirement R-1, met by standard behaviour (ADR-038).
    "a_forged_signature_for_a_small_order_key_is_refused_for_sr25519",
    "an_honest_sr25519_signature_still_verifies",
    # Producer and importer agree, and a block that does not add up is refused.
    "a_block_one_node_produced_executes_identically_on_another",
    "a_block_carrying_a_transfer_reaches_the_same_state_on_both_nodes",
    "a_block_with_a_tampered_state_root_is_refused",
    "a_block_with_a_tampered_extrinsics_root_is_refused",
    "a_run_of_blocks_imports_in_order",
    # A transaction happens once.
    "the_same_transaction_cannot_be_applied_twice",
    "a_transaction_with_a_future_nonce_is_not_applied",
    # No governance action may stop the chain (ADR-020).
    "governance_cannot_empty_the_set_by_removing",
    "governance_cannot_empty_the_set_by_replacing_it",
    "no_sequence_of_governance_calls_can_leave_the_chain_unable_to_author",
    "an_empty_set_in_storage_still_does_not_stop_block_production",
    "a_minimum_of_zero_is_refused_at_startup",
    # A batch is not a second way in (ADR-052 decision 4, ADR-053 decision 3),
    # and a trade that cannot finish moves nothing.
    "a_batch_cannot_smuggle_a_call_the_filter_refuses",
    "a_trade_that_cannot_finish_moves_nothing",
    # A nested asset stays where it is, by every route (ADR-065). R-2 is in alpha.pallets.
    "a_nested_asset_cannot_be_transferred_in_this_runtime",
    "a_batch_cannot_move_a_nested_asset",
    "a_nested_asset_cannot_be_sold",
    # The preview through the runtime API, nesting included: the pallet's mock
    # has no Locker, so only this test catches a preview that ignores it.
    "the_runtime_api_previews_what_a_sale_would_pay",
  ]

  [[gates.criteria]]
  id = "alpha.qor-auth-tests"
  kind = "tests"
  suite = "qor_auth"
  require = ["a_forged_signature_for_a_small_order_key_is_rejected",
             "registering_with_an_email_leaves_it_unverified",
             "the_answer_is_identical_for_every_identifier",
             "every_live_session_dies_on_reset",
             "a_code_works_once_and_the_count_of_those_left_falls",
             "every_refusal_is_the_same_answer",
             "the_nil_user_id_cannot_be_an_audit_actor_or_an_account",
             "a_god_token_as_sign_in_writes_it_is_admitted",
             "a_refusal_from_resend_is_an_error_that_never_carries_the_link",
             "an_account_with_an_expired_token_recovers_through_a_new_one",
             "two_requests_at_once_leave_exactly_one_set_of_ten",
             "an_account_without_an_email_adds_one_and_keeps_its_backup_codes",
             "a_wrong_password_is_refused_and_attaches_nothing",
             "a_password_reset_cancels_a_pending_change",
             "opening_a_verification_link_changes_nothing_and_shows_a_button",
             "opening_a_reset_link_changes_nothing",
             "a_new_address_is_confirmed_by_the_button_not_by_opening_the_link",
             "the_documented_svix_example_verifies",
             "an_unsigned_forged_or_stale_delivery_marks_nothing",
             "a_permanent_bounce_stops_every_send_to_the_address",
             "a_password_account_gets_no_chain_identity",
             "ss58_and_hex_reach_the_same_account",
             "an_account_belongs_to_one_qor_id",
             "an_account_without_proof_is_not_stored",
             "an_address_for_another_network_is_refused",
             "a_challenge_is_spent_once",
             "an_ed25519_signature_is_not_accepted",
             "no_account_keeps_a_key_or_an_address_that_can_no_longer_be_proven",
             # A Windows build and a Linux build record the same migration checksums.
             "no_migration_file_holds_a_carriage_return",
             "no_migration_compiled_into_the_binary_holds_a_carriage_return",
             "a_carriage_return_is_found_and_a_file_without_one_passes",
             # No test can send real mail, whatever the machine's environment holds.
             "a_test_build_sends_only_to_a_stand_in_on_this_machine",
             "only_main_builds_the_email_service_from_the_environment",
             # The end-to-end scripts' guard reads this answer; a wrong "false" is real mail.
             "mail_leaves_this_machine_unless_nothing_is_sent_or_it_goes_to_a_stand_in"]

  # No token, key, secret, password, link or address reaches a log, at any level. The test drives
  # every flow that handles one through the real router and captures everything logged; CI also scans
  # the source for log calls that interpolate one ([ci].quality_gates).
  # Two validators agree, finalise, and a killed one catches up. This is the part
  # of the M1 acceptance behaviour that cannot be tested inside the runtime, and
  # it is a script rather than a cargo test because it needs real nodes.
  [[gates.criteria]]
  id = "alpha.multi-validator"
  kind = "check"
  says = "chain/scripts/check-two-validators.mjs passes: two validators on the local chain specification find each other, produce blocks, hold the same block at a common height, finalise through GRANDPA and agree on what is finalised; and a validator killed and restarted catches up and agrees about the blocks produced while it was away."
  done = true
  evidence = "13 of 13 checks passed on 2026-09-18, against the release build of demiurge-node with the sudo feature. Accepted as evidence by the owner the same day, recorded in HANDOFF.md, and re-run on 2026-09-20 after ADR-041 changed the runtime's address type. Since 2026-09-20 it is a CI job of its own ([ci].quality_gates) that fails the run, so this is no longer a single dated run: the first CI result replaces it as evidence once Actions starts."

  # Nothing repoints the dependency graph. ADR-033: "The SDK's transitive pins are not overridden,
  # with [patch] or otherwise." Seven scripts that did exactly that were deleted on 2026-09-17 and
  # 2026-09-18; this criterion is the control that stops an eighth, because deleting by hand is a fix
  # and a check is a control. Evidence is the CI step, which fails the run on any hit.
  [[gates.criteria]]
  id = "alpha.no-dependency-patching"
  kind = "check"
  says = "CI fails if any tracked manifest contains a [patch] section, or if anything tracked references the owner's personal Substrate fork or any substrate git repository; the exact patterns are in .woodpecker/security.yaml and are not repeated here, because this file is scanned too. Three files are excluded and all are visible in any diff that widens them: .woodpecker/security.yaml and .github/workflows/ci.yml, which must contain the patterns to search for them, and HANDOFF.md, which records the deletions and the rule."
  done = false
  evidence = ""

  [[gates.criteria]]
  id = "alpha.no-secrets-in-logs"
  kind = "tests"
  suite = "qor_auth"
  require = ["nothing_secret_reaches_a_log_at_any_level"]

  # Every SQL statement is a literal with bound parameters. sqlx logs full statement text at debug
  # level, so a value formatted into SQL would reach the log. The test reads the crate's source, checks
  # it saw the service's queries, and fails on any query built from values.
  [[gates.criteria]]
  id = "alpha.parameterised-sql"
  kind = "tests"
  suite = "qor_auth"
  require = ["every_query_in_the_source_is_a_literal_with_bound_parameters",
             "a_query_built_from_values_is_found"]

  [[gates.criteria]]
  id = "alpha.launcher"
  kind = "roadmap"
  items = ["L1.1", "L1.2", "L1.3", "L1.4", "L1.5", "L1.6", "L1.7", "L3.1", "L3.2"]

  [[gates.criteria]]
  id = "alpha.launcher-tests"
  kind = "tests"
  suite = "launcher"
  require = []

  [[gates.criteria]]
  id = "alpha.ci"
  kind = "ci"
  workflow = "Pleroma CI"
  branch = "main"

  [[gates.criteria]]
  id = "alpha.devnet-live"
  kind = "http"
  url = ""
  expect_status = 200

  [[gates.criteria]]
  id = "alpha.qor-id-live"
  kind = "http"
  # /ready, not /health: it tests Postgres and Redis, and /health answers 200 with a dead database.
  url = "https://id.qorsync.dev/ready"
  expect_status = 200

# ===========================================================================
# BETA: the public testnet
# ===========================================================================

[[gates]]
id = "beta"
name = "Beta"
means = """
The public testnet. The first-release scope of ADR-009 is usable by people \
outside the team: universal minting, SDKs, agent rails and the public viewer. \
Nothing holds value, and things can still break."""

  [[gates.criteria]]
  id = "beta.alpha"
  kind = "gate"
  gate = "alpha"

  [[gates.criteria]]
  id = "beta.chain"
  kind = "roadmap"
  items = ["M4.1", "M4.2", "M4.3", "M4.4", "M4.5", "M4.6",
           "M5.1", "M5.2", "M5.3", "M5.4", "M5.5", "M5.6",
           "M6.1", "M6.2", "M6.3", "M6.4", "M6.5", "M6.6",
           "M7.1", "M7.2", "M7.3", "M7.4"]

  [[gates.criteria]]
  id = "beta.launcher"
  kind = "roadmap"
  # L5.1 closes the known gap recorded in ADR-014: until the controller's vault
  # signs agent authorisations, an access token alone can register an agent.
  #
  # L6.3, the QOR Installer, is counted here with L6.1 and L6.2. L6 is one
  # deliverable: an installer nobody can install is not distribution, and the
  # Installer shares the launcher's Rust core, so it carries the same signing
  # and update requirements as the thing it installs. Leaving it out would have
  # let Beta pass with two thirds of L6 done and the third counted by no gate.
  #
  # L2.1 is DELIBERATELY NOT COUNTED, and this is the only record of that.
  # It reads "Gate criteria in GATES.toml approved by the owner". A criterion in
  # this file that counted it would be this file asserting its own approval:
  # the gate would read a roadmap item whose subject is the gate. Circular
  # signals cannot fail, so it is not a signal. Its evidence is the owner's
  # acceptance on 2026-09-14, recorded in the change log above and in
  # HANDOFF.md, which is where an approval belongs.
  # L4.6 was appended to the track on 2026-09-22 and counted by nobody until
  # 2026-09-23. Beta already requires the royalty pallet (M4.2) and the indexer
  # (M5.4) through beta.chain, which are exactly what L4.6 waits on, so counting
  # it here adds no new kind of burden -- it stops the launcher half of selling
  # from being the one L4 item no gate reads.
  items = ["L2.2", "L4.1", "L4.2", "L4.3", "L4.4", "L4.5", "L4.6", "L5.1", "L5.2", "L6.1", "L6.2", "L6.3"]

  # Q-17 blocks the wire format below, so it is counted beside it rather than
  # left to a document nobody has to read. A departure from the SDK's own
  # solochain default costs one line today and a coordinated breaking release
  # once an SDK exists.
  [[gates.criteria]]
  id = "beta.address-type"
  kind = "inventory"
  questions = ["Q-17"]

  # The format was decided on 2026-09-22 (ADR-047, M2.3); this asks for it to be
  # FROZEN, which is a different thing. By the owner's instruction of the same
  # day, GNOSIS's asset requirements go in before the freeze: they are checked
  # against ADR-047's bounds in docs/blueprints/gnosis.md, which flags
  # MaxRoyaltyRecipients as possibly too small. Read that before marking this.
  # The owner carried that bound forward when M2.1 was ticked (ADR-047, open
  # item 1). It is inventory question Q-18, counted by beta.royalty-recipients
  # below, and this criterion's own text requires it answered: a check is marked
  # by hand, so the words have to carry the condition as well as the count.
  [[gates.criteria]]
  id = "beta.wire-format-frozen"
  kind = "check"
  says = "The DRC-369 wire format and token identity are frozen, recorded in an accepted ADR, before any SDK is published. Not before every item in ADR-047's \"Open items before the freeze\" is answered by an accepted ADR, the first of which is the royalty-recipient bound (inventory Q-18)."
  done = false
  evidence = ""

  # ADR-047 set MaxRoyaltyRecipients to 8. A song's credits can pass eight
  # (GNOSIS's blueprint), and after the freeze raising it is a breaking change.
  # Met only when the inventory's Resolution status names an accepted ADR for
  # Q-18, which is what stops the freeze being reached with it unexamined.
  [[gates.criteria]]
  id = "beta.royalty-recipients"
  kind = "inventory"
  questions = ["Q-18"]

  # ADR-047's second open item, found building M4.1: its decisions put the
  # commit and branch inside the manifest, and its consequences say identity is
  # a function of bytes alone. Met only when Q-19 names an accepted ADR.
  [[gates.criteria]]
  id = "beta.manifest-identity"
  kind = "inventory"
  questions = ["Q-19"]

  # ADR-047's third open item, found widening the launcher's media-type table:
  # every file's media type is inside the hashed manifest, so the table is part
  # of identity, and the format names no table. Met only when Q-20 names an
  # accepted ADR.
  [[gates.criteria]]
  id = "beta.media-types"
  kind = "inventory"
  questions = ["Q-20"]

  [[gates.criteria]]
  id = "beta.external-review"
  kind = "check"
  says = "An external security review of the runtime, the launcher vault and QOR ID is complete, and every finding it rates high or critical is closed."
  done = false
  evidence = ""

  [[gates.criteria]]
  id = "beta.value-pallet-coverage"
  kind = "coverage"
  # The pallets that move CGT or own DRC-369 semantics (ADR-025, ADR-026,
  # ADR-029, ADR-032). No other code has a coverage requirement. Unmeasurable
  # until they exist and CI reports their coverage.
  pallets = ["pallet-drc369", "pallet-drc369-royalties", "pallet-sponsorship", "pallet-agent-caps"]
  tool = "cargo-llvm-cov"
  threshold = 80  # percent of lines, per pallet; set by the owner on 2026-09-14

  [[gates.criteria]]
  id = "beta.ci"
  kind = "ci"
  workflow = "Pleroma CI"
  branch = "main"

  [[gates.criteria]]
  id = "beta.testnet-live"
  kind = "http"
  url = ""
  expect_status = 200

  [[gates.criteria]]
  id = "beta.viewer-live"
  kind = "http"
  url = ""
  expect_status = 200

# ===========================================================================
# PUBLIC RELEASE: mainnet
# ===========================================================================

[[gates]]
id = "public-release"
name = "Public Release"
means = """
Mainnet: the chain carries real value, its genesis and issuance are final, and \
the platform (the Mesh, Library, Market and Social) is live on it."""

  [[gates.criteria]]
  id = "public-release.beta"
  kind = "gate"
  gate = "beta"

  [[gates.criteria]]
  id = "public-release.economics-decided"
  kind = "open_question"
  questions = ["OPEN-1", "OPEN-2", "OPEN-3", "OPEN-4", "U-1", "U-10", "U-12", "U-13", "U-14"]

  [[gates.criteria]]
  id = "public-release.platform"
  kind = "roadmap"
  items = ["M8.1", "M8.2", "M8.3", "M8.4",
           "L7.1", "L7.2", "L7.3", "L7.4", "L7.5"]

