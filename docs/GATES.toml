# Release gates: Alpha, Beta and Public Release.
#
# STATUS: ACCEPTED by the owner on 2026-09-14. The launcher's development
# dashboard (DIRECTION.md, L2) computes progress from this file and from
# nothing else.
#
# This is the only place gate criteria are defined. It defines criteria and does
# not restate the roadmap: each criterion points at DIRECTION.md, the decision
# log, the migration inventory, the open questions, a test suite, CI or a URL,
# and names the one signal that decides it.
#
# THE GATES. Alpha is the team devnet. Beta is the public testnet; it is
# deliberately not called a release, so that things can still break. Public
# Release is mainnet.
#
# HOW PROGRESS IS COMPUTED. The dashboard does exactly this and nothing else.
#
#   1. Every countable unit is in exactly one state: met, not_met or unmeasurable.
#      A criterion that lists several items (roadmap items, ADRs, questions)
#      counts once per listed item. Every unit weighs the same.
#   2. unmeasurable means the signal cannot be read today: a service that does
#      not exist yet, code with no location, a pallet list that is still empty.
#      It is never counted as met, and never as not_met. Nothing is stubbed to
#      make a unit measurable.
#   3. For each gate the dashboard shows the raw counts: met, not_met,
#      unmeasurable.
#   4. It draws a progress bar only when a gate has zero unmeasurable units. The
#      bar is met divided by total. Nothing is estimated, smoothed, projected or
#      weighted.
#   5. A unit of kind "check" is asserted by a person, not computed. It is met
#      only when done = true and evidence is not empty, and the dashboard labels
#      it "asserted".
#   6. A gate is passed only when every unit is met.
#
# CHANGING THE EVIDENCE RULES. The evidence rules are what keep the dashboard
# honest, so changing them is governed:
#
#   * LOOSENING needs the owner's approval as a decision of its own, made before
#     the change and recorded in [[change_log]] below. It is never
#     made as part of other work, and never reported only in a status update.
#     Loosening means anything that lets a unit count as met on weaker grounds:
#       - relaxing a kind's `met` condition;
#       - widening what `evidence` may be;
#       - turning a not_met unit into an unmeasurable one;
#       - changing the counting rules above;
#       - removing or relaxing a check inside a CI workflow that a "ci"
#         criterion reads;
#       - lowering a coverage threshold or narrowing a pallet list.
#   * TIGHTENING may be done without asking. It is recorded in the commit that
#     makes it.
#
# HOW ROADMAP ITEMS ARE NAMED. "M3.2" is item 2 under milestone M3 in
# DIRECTION.md. "L1.3" is item 3 under L1 in the launcher track. "P1.2" is item
# 2 under P1 in the product tracks, one heading per product (ADR-050). "7.1.5"
# is item 5 of the security track (section 7.1). Only checkbox lines ("[ ]" or
# "[x]") are readable.

schema = 1
status = "accepted"
accepted = "2026-09-14"

