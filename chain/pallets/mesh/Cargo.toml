[package]
name = "pallet-mesh"
description = "The Mesh's hosting escrow: uploaders fund it at their own prices, seeders are paid from it for storage challenges they answer and serving receipts they hold, and nothing creates CGT (ADR-095, ADR-096)."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
# The storage challenge's proof, the same code the launcher proves with.
mesh-proof = { workspace = true }
polkadot-sdk = { workspace = true, features = ["runtime"] }

[dev-dependencies]
# Tests name files by their BLAKE3 root, as the launcher does.
blake3 = "1.8"
polkadot-sdk = { workspace = true, features = ["std", "runtime", "pallet-balances"] }

[features]
default = ["std"]
std = [
  "codec/std",
  "mesh-proof/std",
  "polkadot-sdk/std",
  "scale-info/std",
]
runtime-benchmarks = ["polkadot-sdk/runtime-benchmarks"]
try-runtime = ["polkadot-sdk/try-runtime"]
