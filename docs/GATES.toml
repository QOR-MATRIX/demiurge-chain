reason = "P1.1's diff, the owner's next Qontrol item after M4.1. The 2026-09-21 correction above unticked P1.1 because a diff that ignored core.autocrlf and .gitattributes would show changes that are not there, and these three tests are that condition written down: CRLF on disk under autocrlf is no change and one changed word is one line out and one in (with `git diff --numstat` asked for a second opinion); a `text` attribute normalises with autocrlf explicitly off, so the attribute alone must do it; and `-diff` makes a text file binary. All three, and two more, failed against a planted naive diff that compared raw bytes. The Projects check drives the diff against a fixture host -- the one file asked for, every line drawn with its number, added and removed lines marked as <ins> and <del> rather than by colour alone, a binary file's sizes, a second choice closing it, a late answer for a file no longer chosen dropped, and the diff gone after a commit -- and failed against three planted faults, one each. Readability measures an open diff in every theme and backdrop: 10 screens, all passing. With these, P1.1 is ticked in DIRECTION.md, so qontrol's roadmap criterion reads one unit met."

