# The devnet node image (docs/architecture/DEVNET_PLAN.md §6 steps 4 and 5).
#
# Builds chain/Dockerfile — the node in release with the `sudo` feature, which is
# for development and test networks only (ADR-037) — and publishes it to the
# repository's container registry as
#
#     ghcr.io/qor-matrix/demiurge-node:sha-<short commit>
#     ghcr.io/qor-matrix/demiurge-node:devnet
#
# STARTED BY HAND ONLY. It has no push, pull-request or schedule trigger: a push
# must never produce an image a validator could be redeployed onto (the plan's
# step 9). The owner runs it from the Actions tab, "Run workflow".
#
# It is not a quality gate and no release criterion reads it. Pleroma CI (ci.yml)
# is unchanged by it.

name: Devnet node image

on:
  workflow_dispatch:

# One publish at a time; a second run waits rather than racing the `devnet` tag.
concurrency:
  group: devnet-image
  cancel-in-progress: false

# Reading the code and writing the package, and nothing else.
permissions:
  contents: read
  packages: write

env:
  # Registry paths must be lower case.
  IMAGE: ghcr.io/qor-matrix/demiurge-node

jobs:
  image:
    name: "Build and publish the devnet node image"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        run: |
          short="$(git rev-parse --short HEAD)"
          {
            echo "list<<EOF"
            echo "${IMAGE}:sha-${short}"
            echo "${IMAGE}:devnet"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is chain/, which is its own workspace; chain/.dockerignore
      # keeps target/ out of it.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: chain
          file: chain/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Demiurge node, sudo feature (development and test networks only, ADR-037)
