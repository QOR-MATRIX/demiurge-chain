[[change_log]]
date = "2026-09-21"
type = "loosening"
change = "The two-validators job runs nightly (03:00 UTC) and on workflow_dispatch instead of on every push and pull request. It still fails the run, and alpha.multi-validator still reads it."
reason = "LOOSENING, and recorded as one: between two nightly runs a change can break two-validator consensus and no push will say so. Accepted because the job builds a Substrate node in release, which is the expensive part -- the script itself takes about two minutes -- and because its subject, consensus between two nodes, changes rarely; almost every push cannot affect it. What makes it tolerable is workflow_dispatch: after touching consensus, the job is triggered by hand rather than waited for. If the chain ever starts changing consensus often, this goes back to every push. Note that no job in this repository has ever executed, so this changes the schedule of something that has not yet run once."

