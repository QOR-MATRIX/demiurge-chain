date = "2026-09-21"
type = "scope change"
change = "check-design.mjs exempts src/qfx/ from exactly two of its eight rules: \"No light or effects that follow the pointer\" and \"No canvas or frame-loop animation\". Every other rule still applies there, and all eight still apply everywhere else in src/. Two checks join the launcher suite: check-contrast.mjs (the QFX contrast guarantee, 11 checks) and check-projects-view.mjs (the Qontrol surface, 31). check-accessibility.mjs gains 7 cases covering reduced motion and ambience, going from 13 to 20."
reason = "A scope split, and it reads like loosening, so it is logged as one. QFX layer one IS a GPU canvas with a frame loop and a pointer-reactive field; it needs the four tokens those two rules forbid. The owner's rule is that the design system governs the default theme and the chrome, and QFX governs the canvas. What makes this a split rather than a relaxation is that src/qfx/ carries obligations the chrome does not: a contrast guarantee enforced by check-contrast.mjs, which solves for the WORST case over every possible backdrop colour rather than sampling, and fails if text could drop below 4.5:1; a frame-time budget that stops the canvas; and reduced motion forcing it still, pinned by six cases. The exemption was proven narrow -- a frame loop planted in a non-qfx view still fails the check. The guarantee was proven to fail first -- lowering the scrim from 0.86 to 0.30 took the default theme text from 13.58:1 to 2.03:1 while the interface still looked fine. The default look is unchanged and still passes all eight rules."

[[change_log]]
date = "2026-09-21"
type = "correction"
change = "The scope-change entry above says check-accessibility.mjs gained 7 cases covering reduced motion and ambience. SIX OF THEM COULD NOT FAIL: each computed the expected ambience inside the check, wrote it to data-ambience and read it back, so it passed whatever the app did. They are replaced by 21 cases that drive the real app -- settings stored where the app keeps them and the page reloaded, so the app's own effectiveAmbience decides -- and that measure behaviour: whether a frame callback is still being scheduled, and whether the canvas and the scrim are displayed. check-accessibility.mjs goes from 20 checks to 34. No gate changes."
reason = "A correction, and a tightening. The replaced cases were a check verifying itself, the failure this project had already named once in check-projects-view.mjs ('a fixture cannot falsify itself'). The real cases found a defect the old ones could not: with Ambience set to Off, the stylesheet removed the scrim while the canvas stayed on screen holding its last frame, so text sat directly on the backdrop, outside the contrast guarantee -- after switching to Off while the launcher ran, and on every launch for anyone who had chosen Off, who also could not turn the backdrop back on without a restart. Fixed in the same change: Off hides the canvas, draws nothing and schedules nothing, and the GL context is created only when the backdrop is first wanted. Proven to fail first: against the canvas as it was, three cases failed (canvas still shown after Off; still shown when Off was stored; never started when Off was stored and Live chosen later); with effectiveAmbience planted to ignore reduced motion, four failed. The earlier entry stays exactly as written."

[[change_log]]
date = "2026-09-21"
type = "tightening"
change = "The launcher job runs npm run check instead of naming three scripts, so check-projects-view.mjs and check-contrast.mjs -- which the scope-change entry above says joined the launcher suite, and which package.json ran, but which the workflow never listed -- now run in CI and cannot drift out again. The qontrol-git helper gets cargo fmt --check, clippy -D warnings, tests and a build, and a cargo audit in the security job. The host tests run with --features qontrol-no-skips. [ci].quality_gates records all of it."
reason = "Tightening. Phase 4 put Qontrol's split path under three tests proven to fail first, and none of them would ever have run in CI: nothing built the helper, and each test returned early -- reporting ok -- when the helper was absent. A skip that reads as a pass is the failure GATES.toml exists to prevent. qontrol-no-skips turns that early return into a failure, for the helper and for git itself. Proven: with QONTROL_GIT_BIN pointed at nothing, the Qontrol tests pass 11 of 11 without the feature and fail 6 with it. The helper crate was not rustfmt-clean when committed and is formatted in this change; its clippy, its 6 tests and cargo audit were already clean. Still unconfirmed on a runner, because no job in this workflow has ever executed (L1.7)."

